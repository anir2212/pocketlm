[project]
name = "pocketlm"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "datasets>=3.5,<5",
  "peft>=0.15,<1",
  "trl>=0.17,<1",
  "accelerate>=1.5,<2",
  "datasketch>=1.6,<2",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "numpy>=2,<3",
  "psutil>=7,<9",
  "huggingface-hub>=0.30,<2",
]

[project.optional-dependencies]
demo = ["gradio>=5,<6"]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]
cuda = ["bitsandbytes>=0.45,<1"]
general-eval = ["lm-eval[hf]>=0.4,<1"]
quant = ["sentencepiece>=0.2,<1"]
plot = ["matplotlib>=3.9,<4"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
